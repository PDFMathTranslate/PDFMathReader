name: Draft release from CI artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Electron compile run ID (from the Actions URL)'
        required: true
        type: string
      tag:
        description: 'Release version, e.g. v0.1.0 or v0.1.0-beta.1'
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: draft-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      # Use the runner's gh, jq and Python; no checkout or dependency install.
      - name: Validate inputs and source build
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Run ID must be numeric.' >&2; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || {
            echo 'Tag must be a version such as v0.1.0 or v0.1.0-beta.1.' >&2
            exit 1
          }
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" > source-run.json
          jq -e --arg repo "$GH_REPO" '
            .status == "completed" and .conclusion == "success" and
            .path == ".github/workflows/electron-build.yml" and
            .head_repository.full_name == $repo and
            (.event == "push" or .event == "workflow_dispatch")
          ' source-run.json > /dev/null || {
            echo 'Select a successful Electron compile run from this repository.' >&2
            exit 1
          }
          sha=$(jq -r '.head_sha' source-run.json)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          # An existing tag must resolve to the commit that produced the binaries.
          tag_path=$(jq -rn --arg tag "$RELEASE_TAG" '$tag | @uri')
          gh api "repos/$GH_REPO/git/matching-refs/tags/$tag_path" > tag-refs.json
          if jq -e --arg ref "refs/tags/$RELEASE_TAG" 'any(.[]; .ref == $ref)' tag-refs.json > /dev/null; then
            tag_sha=$(gh api "repos/$GH_REPO/commits/$tag_path" --jq '.sha')
            [[ "$tag_sha" == "$sha" ]] || { echo 'Existing tag points to a different commit.' >&2; exit 1; }
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Download and validate all six installation packages
        shell: bash
        run: |
          set -euo pipefail
          targets=(darwin-arm64 darwin-x64 win32-x64 win32-ia32 linux-x64 linux-armv7l)
          for target in "${targets[@]}"; do
            name="PDFMathReader-$target"
            gh run download "$SOURCE_RUN_ID" --name "$name" --dir "artifacts/$name"
            extension=tar.gz
            if [[ "$target" == win32-* ]]; then extension=zip; fi
            archive="artifacts/$name/$name.$extension"
            [[ -s "$archive" ]] || { echo "Missing or empty package: $archive" >&2; exit 1; }
            if [[ "$extension" == zip ]]; then
              python3 -c 'import sys, zipfile; archive = zipfile.ZipFile(sys.argv[1]); bad = archive.testzip(); assert bad is None, f"Corrupt ZIP entry: {bad}"' "$archive"
            else
              tar -tzf "$archive" > /dev/null
            fi
          done

      - name: Create draft release with existing build artifacts
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          assets=(
            artifacts/PDFMathReader-darwin-arm64/PDFMathReader-darwin-arm64.tar.gz
            artifacts/PDFMathReader-darwin-x64/PDFMathReader-darwin-x64.tar.gz
            artifacts/PDFMathReader-win32-x64/PDFMathReader-win32-x64.zip
            artifacts/PDFMathReader-win32-ia32/PDFMathReader-win32-ia32.zip
            artifacts/PDFMathReader-linux-x64/PDFMathReader-linux-x64.tar.gz
            artifacts/PDFMathReader-linux-armv7l/PDFMathReader-linux-armv7l.tar.gz
          )
          release_url=$(gh release create "$RELEASE_TAG" "${assets[@]}" \
            --draft --target "$SOURCE_SHA" --title "$RELEASE_TAG" --generate-notes)
          {
            printf '### Draft release\n\n%s\n\n' "$release_url"
            printf 'Source build: https://github.com/%s/actions/runs/%s\n\n' "$GH_REPO" "$SOURCE_RUN_ID"
            printf 'Commit: `%s`\n\nAttached all six installation packages.\n' "$SOURCE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
