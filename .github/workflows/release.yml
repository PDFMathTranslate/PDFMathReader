name: Electron release

on:
  workflow_run:
    workflows: ['Electron test']
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: electron-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      # Execute trusted default-branch release logic; read version from tested SHA.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate version gate
        run: node --test .github/scripts/*release*.test.mjs
      - name: Publish tested packages only when version increases
        run: node .github/scripts/publish-release.mjs
